services:
  proxy:
    image: nginx
    restart: unless-stopped
    expose:
      - 80
    networks:
      - backends
      - cars-backend
      - virtual-hosts
    depends_on:
      - web
    labels:
      - traefik.http.routers.cars-ge.rule=Host(`cars.kewldan.ru`)
      - traefik.enable=true
      - traefik.http.services.cars-ge.loadbalancer.server.port=80
      - traefik.http.routers.cars-ge.tls=true
      - traefik.http.routers.cars-ge.tls.certresolver=myresolver
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
  web:
    build: .
    restart: unless-stopped
    networks:
      - backends
    environment:
      NEXT_PUBLIC_SITE_URL: https://cars.kewldan.ru
      # Server-side fetch base for RSC (detail page, OG images). Goes back through
      # nginx so the existing /api → cars-api proxy rule applies. The browser
      # uses the default `/api` (same-origin), no env var needed.
      API_URL: http://proxy/api
    expose:
      - 80

networks:
  backends:
  cars-backend:
    external: true
  virtual-hosts:
    external: true
